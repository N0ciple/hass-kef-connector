rules:
  # Bronze
  action-setup:
    status: exempt
    comment: No custom action; play_media is provided by the media player.
  appropriate-polling:
    status: exempt
    comment: Push updates from the speaker event queue, no polling.
  brands: done
  common-modules: done
  config-flow-test-coverage: todo
  config-flow: done
  dependency-transparency: done
  docs-actions:
    status: exempt
    comment: No custom action.
  docs-conditions:
    status: exempt
    comment: No condition.
  docs-high-level-description: done
  docs-installation-instructions: done
  docs-removal-instructions: done
  docs-triggers:
    status: exempt
    comment: No trigger.
  entity-event-setup:
    status: done
    comment: Coordinator entities; the watch task is tied to the config entry.
  entity-unique-id: done
  has-entity-name: done
  runtime-data: done
  test-before-configure: done
  test-before-setup: done
  unique-config-entry: done

  # Silver
  action-exceptions: done
  config-entry-unloading: done
  docs-configuration-parameters: done
  docs-installation-parameters: done
  entity-unavailable: done
  integration-owner: done
  log-when-unavailable: done
  parallel-updates: done
  reauthentication-flow:
    status: exempt
    comment: The speaker API has no user authentication.
  test-coverage: todo

  # Gold
  devices: done
  diagnostics: done
  discovery-update-info: done
  discovery: done
  docs-data-update: done
  docs-examples: done
  docs-known-limitations: done
  docs-supported-devices: done
  docs-supported-functions: done
  docs-troubleshooting: done
  docs-use-cases: done
  dynamic-devices:
    status: exempt
    comment: One config entry per speaker.
  entity-category: done
  entity-device-class: done
  entity-disabled-by-default: done
  entity-translations: done
  exception-translations: done
  icon-translations: done
  reconfiguration-flow: done
  repair-issues:
    status: done
    comment: Deprecated YAML configuration (imported into a config entry).
  stale-devices:
    status: exempt
    comment: One device per config entry.

  # Platinum
  async-dependency: done
  inject-websession: done
  strict-typing: done
